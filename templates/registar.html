<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <title>Registar | Apoio à Habitação</title>
{% include '_head.html' %}
</head>

<body>
<button class="theme-toggle theme-toggle--float" id="theme-toggle" type="button">Modo escuro</button>
  <main class="registar">

    <aside class="registar__side">
      <a class="logo" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="">
        <span>Apoio à Habitação</span>
      </a>
      <h1>Registe-se</h1>
      <p>Crie uma conta para acompanhar os seus pedidos e continuar onde ficou.</p>
    </aside>

    <section class="registar__panel">
      <form class="form" action="{{ url_for('registar') }}" method="post" novalidate>
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <h2>Registar</h2>

        {% include '_mensagens.html' %}

        <label for="name">Nome</label>
        <input id="name" name="name" type="text" autocomplete="name" placeholder="Nome" value="{{ form.get('name', '') }}" required>

        <label for="apelido">Apelido</label>
        <input id="apelido" name="apelido" type="text" autocomplete="family-name" placeholder="Apelido" value="{{ form.get('apelido', '') }}" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="nome@exemplo.pt" value="{{ form.get('email', '') }}" required>

        <label for="password">Palavra-passe</label>
        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required>

        <button class="btn btn--full" type="submit">Registar</button>

        <p class="form__foot">Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></p>
      </form>
    </section>

  </main>
</body>
</html>
